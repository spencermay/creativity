appraiser:
  hidden_dim: 64
  inner_lr: 0.01
  inner_steps: 5
creator:
  hidden_dim: 256
  img_channels: 3
  img_size: 84
  latent_dim: 128
  n_classes: 100
data:
  augment: true
  dataset: mini-imagenet
  img_size: 84
  num_workers: 4
  root: data/mini-imagenet
episode:
  k_shot: 5
  n_way: 5
  q_query: 15
loss:
  diversity_mode: pixel
  lambda_diversity: 0.1
  lambda_memorability: 1.0
  lambda_novelty: 1.0
meta:
  episodes_per_batch: 4
  max_episodes: 60000
  outer_lr_appraiser: 0.001
  outer_lr_creator: 0.001
training:
  device: cpu
  eval_episodes: 100
  eval_interval: 1000
  log_interval: 100
  output_dir: outputs
  save_interval: 5000
  seed: 42
wandb:
  enabled: false
  entity: null
  project: creator-appraiser
  run_name: null
